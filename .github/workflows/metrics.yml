name: Profile metrics

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/metrics.py", ".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render metrics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/metrics.py "${{ github.repository_owner }}" dist
      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: refresh profile metrics"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
